name: Publish

on:
  push:
    branches:
      - master

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # v11+ required: native `pnpm publish` supports OIDC trusted publishing
          # (automatic GitHub Actions OIDC token exchange, no NODE_AUTH_TOKEN needed)
          version: 11.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish changed packages (OIDC trusted publishing)
        run: bash scripts/publish-changed.sh
        env:
          # No NODE_AUTH_TOKEN needed — npm CLI exchanges the OIDC token automatically
          NPM_CONFIG_PROVENANCE: "true"
